services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  fairtriage:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      FAIRTRIAGE_MONGO_URL: mongodb://mongo:27017
    depends_on: [mongo]

volumes:
  mongo-data:
