# FairTriage NT — policy configuration
#
# Every number that influences a ranking lives here, and every one of them is
# rendered on screen. An invisible weight is the same problem as an invisible
# model. Change a value -> bump `version` -> old recommendations remain
# explainable because each assessment stores the version that produced it.

version: "policy-2026.10-v10"

# ---------------------------------------------------------------------------
# Tier ladder. Lexicographic and non-compensatory: nothing in a lower tier can
# climb into a higher one, whatever else is true.
# ---------------------------------------------------------------------------
tiers:
  order: [Immediate, Urgent, Routine]

# ---------------------------------------------------------------------------
# Need score, applied WITHIN a tier only. There is no distance term, and no
# variable exists for kilometres to be placed in.
# ---------------------------------------------------------------------------
# v4: inside the Immediate tier every job is "uninhabitable", so habitability
# alone could not separate a flooded house from a lock that will not catch.
# Two observable facts now do that work. Weights must sum to 1.
need_weights:
  habitability: 0.35
  extent: 0.15          # whole house affected, or one fixture / one room
  containment: 0.20     # can it still hurt someone, or has the tenant made it safe
  vulnerability: 0.30

# Life at risk right now (fire, explosion, someone hurt) tops the Immediate
# tier outright. The tenant is told to call 000 before anything else.
emergency_need: 100

extent_score:
  whole_dwelling: 1.00
  one_fixture: 0.40

# Isolation is only credited when the tenant SAYS they have done it. Unknown
# is treated as not contained, because assuming safety is the dangerous error.
containment_score:
  not_contained: 1.00
  tenant_made_safe: 0.30

habitability_score:
  uninhabitable: 1.00
  severely_impaired: 0.70
  impaired: 0.40
  cosmetic: 0.10
  none: 0.00

# Self-reported, therefore gameable. Accepted deliberately: a modifier within
# a tier, never a tier jump, and the coordinator sees the claim itself.
vulnerability_score:
  medical_equipment: 1.00
  disability: 0.80
  elderly: 0.75
  children: 0.65

# ---------------------------------------------------------------------------
# Service targets, in business days.
# UNVERIFIED: the remote figures appear in a Government Employee Housing form,
# a different tenancy stream from remote public housing. Confirm against the
# Tenancy Management Support Services Handbook before relying on them.
# ---------------------------------------------------------------------------
service_targets_days:
  Immediate: {urban: 0.17, remote: 0.17}     # 4 hours
  Urgent:    {urban: 2,    remote: 5}
  Routine:   {urban: 10,   remote: 25}
service_targets_verified: false

# ---------------------------------------------------------------------------
# Wait estimate
# ---------------------------------------------------------------------------
wait:
  # v7: time from report to a crew being booked, before any queue. Routine work
  # is programmed into the week, not dispatched on the day; without this a
  # quiet queue showed routine jobs as "within a day". PLACEHOLDER values:
  # replace with the department's real booking times.
  # v8: Routine 5 -> 3. At 5 the booking time was most of every routine
  # estimate, so rank and location barely showed; the queue now carries that.
  lead_days: {Immediate: 0.1, Urgent: 1.0, Routine: 3.0}
  # no estimate is shorter than this, even for a job that has already waited
  # past its booking time: non-urgent work is still booked into a working day
  floor_days: {Immediate: 0.1, Urgent: 0.5, Routine: 1.0}
  road_penalty_days: {open: 0, restricted: 2, closed: 7}
  scheduled_trip_discount_days: 3

  # v8: the queue is the on-site hours of the SAME trade's work ranked ahead
  # in the same region, divided by that trade's crew hours per day
  # (crews x share x trips.capacity_hours_per_day). A plumbing job does not
  # wait behind an electrician's. PLACEHOLDER shares: replace with the real
  # make-up of each region's crews.
  trade_share:
    Plumber: 0.30
    Electrician: 0.25
    Builder: 0.15
    Handyperson: 0.15
    Locksmith: 0.05
    Gas Fitter: 0.05
    Pest Control: 0.05
  trade_share_default: 0.15
  min_trade_crews: 1            # a contractor can always be called in

  # v8: Immediate jobs go to on-call make-safe contractors, around the clock,
  # with that trade's day crews dropping other work. A make-safe visit (power
  # isolated, water off, door boarded) is shorter than the repair after it.
  # PLACEHOLDER values: replace with the department's on-call arrangements.
  make_safe:
    on_call_per_trade: {Darwin: 2, Katherine: 1, Arnhem: 1}
    hours_per_job: 1.0
    target_hours: 4             # an Immediate wait past this alerts the coordinator

  # v8: days to get a crew moving to a remote community before it travels:
  # booking a charter or barge, packing parts. PLACEHOLDER values.
  mobilise_days:
    air_or_barge: {Immediate: 0.25, Urgent: 1.0, Routine: 1.0}
    remote_road:  {Immediate: 0.1,  Urgent: 0.5, Routine: 0.0}

  # v8: the range (never a date) widens where the estimate is less certain,
  # instead of a flat +/- 25%. Fractions of the central estimate, added up.
  spread:
    base: 0.15
    remote: 0.10
    restricted: 0.15            # road status
    closed: 0.25
    long_queue: 0.10            # a day or more of work ahead
    max: 0.50
    trip_max: 0.15              # a remote routine job waiting for the planner's next trip

# ---------------------------------------------------------------------------
# Scheduling loop
# ---------------------------------------------------------------------------
trips:
  # a community generates its own trip when its oldest open job has waited
  # this multiple of its service target. Printed on screen with its value.
  community_threshold_multiple: 3.0
  capacity_hours_per_day: 7.5   # on-site work per trip day
  trip_days: 2                  # so a trip holds 15 hours of on-site work
  workday_hours: 10             # crew hours per day, driving + work: turns hours into days
  # v8: a non-remote community within this drive of its depot is served by the
  # daily crews, not by planned trips (Humpty Doo, Batchelor, Pine Creek)
  daily_reach_hours: 1.5
  match_trade: true             # a stop must need the trade the trip carries
  stops_include_urban: false    # Darwin suburbs have their own daily crews

  # v6: routes. The planner compares the fastest route with slower routes that
  # pass more open jobs, and picks one. Every rule below is shown on screen.
  routing:
    restricted_speed_factor: 0.6  # a restricted road is driven at 60% speed
    max_alternatives: 4
    max_route_ratio: 1.8          # slower than 1.8x the fastest is a detour, not a route
    paths_examined: 60
    # these tiers go by the fastest route with no stops before them
    direct_tiers: [Immediate]
    # stops may use at most 75% of the destination job's remaining time to
    # target; 25% is kept in reserve for the road being worse than expected
    anchor_slack_reserve: 0.25
    # a job already past its target may be delayed by at most this much
    overdue_delay_cap_hours: 2.0
    # route choice: value of the jobs a route serves, minus its extra hours.
    # a job's value = tier value x (1 + min(days waited / target, cap))
    stop_value: {Immediate: 3, Urgent: 2, Routine: 1}
    wait_bonus_cap: 2.0
    # value given up per extra hour of travel. At 1.0, one Routine job is worth
    # a detour of 1-3 h depending on how long it has waited: about what a
    # separate trip to it would cost, so a detour never costs more than that.
    extra_hour_cost: 1.0
    charter_cost: 3.0             # a charter flight costs money: counted as this much value

# ---------------------------------------------------------------------------
# Trip cost estimate (v9). Shown beside each recommended trip so staff can
# budget and compare. NEVER used to decide who is served or in what order:
# a trip to a remote community costs more, and that must not push it back.
# Every figure is [low, high] in AUD, excluding GST. v10: checked against
# public sources (October 2026), noted beside each value. Still estimates:
# replace with the department's contract rates, fleet data and allowances.
# "UNVERIFIED" marks values no public source was found for.
# ---------------------------------------------------------------------------
trip_cost:
  vehicle:
    type: "4WD utility, diesel, carrying tools and parts"
    # real-world loaded HiLux/Ranger 10-12 L/100 km, 12-15 towing (4X4 Australia)
    litres_per_100km: 13
    unsealed_factor: 1.25         # more fuel and wear on unsealed or restricted roads
    # Darwin diesel about $2.72 terminal gate, $2.88 cheapest pump (30 Sep 2026);
    # Wadeye $2.88, Maningrida $3.58, Arnhem Land near $4 in March 2026 (ABC)
    fuel_price_per_litre: [2.75, 3.60]
    # non-fuel running costs. ATO 2025-26 all-in rate is 88c/km including fuel;
    # fuel here is about 37c/km, leaving about 50c for tyres, servicing, wear
    running_cost_per_km: [0.40, 0.60]
  charter:
    aircraft: "light twin charter (5 to 6 seats)"
    cruise_kmh: 250
    # piston twins in Australia: Baron about $1,200/h, Navajo $700-1,500/h;
    # remote NT and fuel surcharges push towards the top
    rate_per_flight_hour: [1100, 1800]
    # operators bill a minimum per flight however short (reported 1.5-2 h;
    # 1 h used until confirmed with a Darwin operator)
    minimum_hours_per_flight: 1.0
    landing_fee: [30, 70]         # per landing. UNVERIFIED: councils set these
    # with nights away the aircraft goes home and comes back: billed twice
    reposition_when_overnight: true
  crew:
    tradespeople: 1
    # a second person on any trip with nights away or remote roads: remote
    # driving and working alone is not safe
    assistant_on_remote_trips: 1
  labour_rate_per_hour:           # charge-out rate including on-costs
    Electrician: [90, 140]        # Darwin $80-110, Australia $80-130, master $100-150
    Plumber: [100, 160]           # Darwin business hours $100-160
    Gas Fitter: [100, 160]        # licensed gas work: as plumbing
    Builder: [85, 120]            # UNVERIFIED
    Locksmith: [80, 120]          # UNVERIFIED
    Handyperson: [60, 90]         # UNVERIFIED
    Pest Control: [80, 120]       # UNVERIFIED
    assistant: [50, 75]           # employee wages in Darwin about $46-52/h, plus on-costs
  ordinary_hours_per_day: 7.6     # 38-hour week; hours past this are overtime
  overtime_loading: 0.5           # paid at 1.5x
  immediate_callout_loading: [0.0, 0.5]   # an Immediate job may fall after hours
  setup_hours_per_stop: 0.5       # park, find the tenant, unload, clean up
  job_hours_range: [0.85, 1.4]    # repairs often take longer than estimated
  logistics:
    # ATO 2025-26 reasonable amounts: country centres $188, Darwin $220;
    # council visitor rooms (Roper Gulf) $200 a night
    accommodation_per_person_night: [190, 260]
    # ATO 2025-26 meals + incidentals: country centres $174, Darwin $165 a day
    meals_per_person_day_overnight: [140, 175]
    meals_per_person_day_day_trip: [0, 40]       # ATO overtime meal $38.65
    freight_air_trip: [150, 400]   # tools and parts flown in. UNVERIFIED
    local_vehicle_per_day_air_trip: [100, 250]   # community vehicle hire. UNVERIFIED
  materials_per_job:              # parts and consumables, by trade. UNVERIFIED
    Electrician: [30, 250]
    Plumber: [40, 300]
    Gas Fitter: [50, 350]
    Builder: [100, 600]
    Locksmith: [40, 200]
    Handyperson: [20, 150]
    Pest Control: [60, 200]
  contingency: [0.05, 0.15]       # weather, road delays, a return visit. A planning choice

# ---------------------------------------------------------------------------
# Alerts
# ---------------------------------------------------------------------------
alerts:
  repeat_deferral_at: 2

extraction:
  max_clarification_rounds: 1
